name: GRC Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for Cosign keyless signing via GitHub OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform

jobs:
  grc-gate:
    name: GRC Gate
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. PLAN — terraform init + plan, save output for policy check
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      # ----------------------------------------------------------------
      # 2. POLICY CHECK — conftest runs OPA policies against the plan
      # ----------------------------------------------------------------
      - name: Install Conftest
        run: |
          curl -sLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.57.0/conftest_0.57.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Policy Check
        working-directory: ${{ env.TF_DIR }}
        run: conftest test tfplan.json --policy ../policies --all-namespaces

      # ----------------------------------------------------------------
      # 3. APPLY — only on merge to main, not on PRs
      # ----------------------------------------------------------------
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve

      # ----------------------------------------------------------------
      # 4. SIGN — Cosign keyless signing of evidence bundle via OIDC
      # ----------------------------------------------------------------
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Build and sign evidence bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ env.TF_DIR }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BUNDLE="evidence-${TIMESTAMP}-${{ github.sha }}.tar.gz"

          tar -czf "../${BUNDLE}" tfplan.json

          cosign sign-blob \
            --yes \
            --bundle "../${BUNDLE}.bundle" \
            "../${BUNDLE}"

          echo "BUNDLE=${BUNDLE}" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # 5. UPLOAD — push signed bundle to the S3 evidence vault
      # ----------------------------------------------------------------
      - name: Upload evidence bundle to vault
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VAULT=$(cd terraform && terraform output -raw evidence_bucket)
          aws s3 cp "${BUNDLE}" "s3://${VAULT}/pipeline/${BUNDLE}"
          aws s3 cp "${BUNDLE}.bundle" "s3://${VAULT}/pipeline/${BUNDLE}.bundle"
          echo "Evidence uploaded to s3://${VAULT}/pipeline/${BUNDLE}"
